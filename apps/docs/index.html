    <script>
      // Restore saved theme before first paint to avoid a flash of the wrong mode on reload.
      (function () {
        try {
          var m = localStorage.getItem('vl-mode');
          var a = localStorage.getItem('vl-accent');
          var r = localStorage.getItem('vl-rm');
          var el = document.documentElement;
          if (m === 'light' || m === 'dark') el.dataset.mode = m;
          if (a) el.dataset.accent = a;
          if (r) el.dataset.rm = r;
        } catch (e) {}
      })();
    </script>

    <style>
      .vl-ssr-shell{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1d23;color:#f4f5f7;font-family:'Geist',system-ui,sans-serif;z-index:9999}
      :root[data-mode="light"] .vl-ssr-shell{background:#fcfcfd;color:#262a33}
      .vl-ssr-shell__inner{display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;animation:vl-ssr-in .35s cubic-bezier(.16,1,.3,1) forwards}
      .vl-ssr-shell__mark{display:flex;align-items:center;gap:10px}
      .vl-ssr-shell__badge{width:28px;height:28px;border-radius:7px;background:#5f7cf2;display:inline-flex;align-items:center;justify-content:center}
      .vl-ssr-shell__slash{width:4px;height:15px;background:#fff;transform:skewX(-22deg);display:inline-block}
      .vl-ssr-shell__name{font-weight:600;font-size:18px;letter-spacing:-.01em}
      .vl-ssr-shell__name span{color:#8a8f99;font-weight:500}
      :root[data-mode="light"] .vl-ssr-shell__name span{color:#6b7280}
      .vl-ssr-shell__bar{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
      :root[data-mode="light"] .vl-ssr-shell__bar{background:rgba(0,0,0,.06)}
      .vl-ssr-shell__bar::after{content:"";position:absolute;inset:0;background:#5f7cf2;transform-origin:left;animation:vl-ssr-bar 1.1s cubic-bezier(.22,1,.36,1) infinite}
      .vl-ssr-shell__seo{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
      @keyframes vl-ssr-in{to{opacity:1}}
      @keyframes vl-ssr-bar{0%{transform:scaleX(0);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}50.01%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
      @media (prefers-reduced-motion:reduce){.vl-ssr-shell__inner{animation:none;opacity:1}.vl-ssr-shell__bar::after{animation:none;transform:scaleX(.4)}}
    </style>
    <div id="root">
      <!-- Branded SSR splash — shown for ~400ms before React mounts. Contains an invisible SEO/LLM text block for non-rendering crawlers. -->
      <div class="vl-ssr-shell">
